name: Release

# Build installable packages for macOS (arm64 and Intel x86_64 DMGs) and Linux
# (deb/rpm/AppImage for x86_64 and arm64) with rkdeveloptool bundled, and
# attach them to a GitHub Release on tag push.
#
# The macOS Intel (x86_64) build runs on the scarce macos-15-intel runners (the
# last Intel image GitHub Actions provides, retiring around August 2027), so it
# is kept separate and non-blocking: the release is published from the arm64 +
# Linux builds, and the Intel DMG is appended to the same release whenever it
# finishes.
on:
  push:
    # Matches both bare (5.0.0) and v-prefixed (v1.0.0) version tags.
    tags: ["[0-9]*", "v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install automake autoconf libtool pkg-config create-dmg

      - name: Build bundled rkdeveloptool
        run: bash packaging/build-rkdeveloptool.sh "$PWD/dist/rkdeveloptool"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build app bundle (Nuitka)
        run: python build_nuitka.py

      - name: Bundle rkdeveloptool into the .app
        run: |
          SRC_APP="$(ls -d dist/*.app | head -1)"
          APP="dist/RKDevelopTool-GUI.app"
          [ "$SRC_APP" = "$APP" ] || mv "$SRC_APP" "$APP"
          cp dist/rkdeveloptool "$APP/Contents/MacOS/rkdeveloptool"
          chmod +x "$APP/Contents/MacOS/rkdeveloptool"

      - name: Create DMG
        run: |
          DMG="dist/RKDevelopTool-GUI-arm64.dmg"
          create-dmg --volname "RKDevelopTool-GUI" --no-internet-enable \
            "$DMG" "dist/RKDevelopTool-GUI.app" \
          || hdiutil create -volname "RKDevelopTool-GUI" \
               -srcfolder "dist/RKDevelopTool-GUI.app" -ov -format UDZO "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg

  linux:
    name: Linux ${{ matrix.arch }} (deb / rpm / AppImage)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            pkg_arch: amd64
            nfpm_arch: x86_64
            appimage_arch: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            pkg_arch: arm64
            nfpm_arch: arm64
            appimage_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            pkg-config curl file imagemagick desktop-file-utils libfuse2 zsync \
            appstream
          # Runtime dependencies of Qt's xcb platform plugin. They are not
          # needed to build, but make-appimage.sh copies them into the AppImage
          # so it also runs on systems that don't have them (the AppImage
          # catalog's test container is one), so they must be present here.
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Build bundled rkdeveloptool
        run: bash packaging/build-rkdeveloptool.sh "$PWD/dist/rkdeveloptool"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build app (Nuitka onefile)
        run: python build_nuitka.py

      - name: Normalize binary name
        run: |
          if [ -f dist/rkdevtoolgui.bin ]; then mv dist/rkdevtoolgui.bin dist/rkdevtoolgui; fi
          test -f dist/rkdevtoolgui
          chmod +x dist/rkdevtoolgui

      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm

      # The committed AppStream file carries no <releases>: stamp the version
      # being released here so software centres show it, without anyone having
      # to remember to edit the file on every release.
      - name: Stamp the release into the AppStream metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          F=packaging/io.github.gahingwoo.rkdeveloptool_gui.appdata.xml
          python3 - "$F" "$VERSION" "$(date -u +%F)" <<'PY'
          import sys
          path, version, date = sys.argv[1:]
          text = open(path, encoding="utf-8").read()
          release = (f'  <releases>\n    <release version="{version}" date="{date}"/>\n'
                     f'  </releases>\n</component>')
          assert text.count("</component>") == 1
          open(path, "w", encoding="utf-8").write(text.replace("</component>", release))
          PY
          appstreamcli validate --no-net "$F"

      - name: Package deb + rpm
        env:
          PKG_ARCH: ${{ matrix.pkg_arch }}
        run: |
          # On a tag push the ref name *is* the version. On a workflow_dispatch
          # it is a branch name, which nfpm rejects as a version, so only take
          # it when it looks like one.
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            [0-9]*) ;;
            *) VERSION="0.0.0" ;;
          esac
          export VERSION
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/

      - name: Build AppImage
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: bash packaging/make-appimage.sh

      # This runner has Qt's X11 dependencies installed, so starting the app
      # here proves nothing about other machines. Run it in a container holding
      # only what AppImage's excludelist lets us assume the host provides -
      # the same situation as the AppImage catalog's test, which is how a
      # missing libxkbcommon-x11.so.0 shipped unnoticed for several releases.
      - name: Smoke-test the AppImage on a bare system
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm-slim \
            bash -euo pipefail -c '
              # Only the libraries AppImage'"'"'s excludelist lets a bundle assume.
              # Not tolerant of failure: silently installing nothing would
              # leave Xvfb missing and make this test vacuous.
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                --no-install-recommends xvfb libx11-6 libx11-xcb1 libxcb1 \
                libxcb-dri2-0 libxcb-dri3-0 libfontconfig1 libfreetype6 \
                libgl1 libegl1 libexpat1 zlib1g > /dev/null
              command -v Xvfb > /dev/null || { echo "Xvfb missing"; exit 1; }
              cp /dist/*.AppImage /tmp/app.AppImage
              chmod +x /tmp/app.AppImage
              export APPIMAGE_EXTRACT_AND_RUN=1 DISPLAY=:99
              Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
              sleep 3
              set +e
              timeout 40 /tmp/app.AppImage > /tmp/app.log 2>&1
              rc=$?
              set -e
              echo "===== app output ====="; cat /tmp/app.log; echo "====================="
              if grep -qiE "cannot open shared object file|could not (load|find) the Qt platform plugin" /tmp/app.log; then
                echo "FAIL: the AppImage is missing a bundled runtime library"
                exit 1
              fi
              # A healthy GUI app runs until timeout kills it (124). Any other
              # code means it exited on its own, i.e. it never opened a window.
              if [ "$rc" != "124" ]; then
                echo "FAIL: app exited on its own (exit code $rc) instead of staying up"
                exit 1
              fi
              echo "OK: app stayed running, Qt platform plugin loaded"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.AppImage.zsync

  release:
    name: Publish Release
    needs: [macos-arm64, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  macos-x86_64:
    name: macOS (Intel x86_64)
    runs-on: macos-15-intel
    # Intel runners are scarce and the image retires around August 2027; never
    # let this block or fail the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install automake autoconf libtool pkg-config create-dmg

      - name: Build bundled rkdeveloptool
        run: bash packaging/build-rkdeveloptool.sh "$PWD/dist/rkdeveloptool"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build app bundle (Nuitka)
        run: python build_nuitka.py

      - name: Bundle rkdeveloptool into the .app
        run: |
          SRC_APP="$(ls -d dist/*.app | head -1)"
          APP="dist/RKDevelopTool-GUI.app"
          [ "$SRC_APP" = "$APP" ] || mv "$SRC_APP" "$APP"
          cp dist/rkdeveloptool "$APP/Contents/MacOS/rkdeveloptool"
          chmod +x "$APP/Contents/MacOS/rkdeveloptool"

      - name: Confirm x86_64 architecture
        run: |
          APP="$(ls -d dist/*.app | head -1)"
          file "$APP/Contents/MacOS/"*

      - name: Create DMG
        run: |
          DMG="dist/RKDevelopTool-GUI-x86_64.dmg"
          create-dmg --volname "RKDevelopTool-GUI" --no-internet-enable \
            "$DMG" "dist/RKDevelopTool-GUI.app" \
          || hdiutil create -volname "RKDevelopTool-GUI" \
               -srcfolder "dist/RKDevelopTool-GUI.app" -ov -format UDZO "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: dist/*.dmg

      # Append the Intel DMG to the (already published) release for this tag.
      - name: Attach Intel DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RKDevelopTool-GUI-x86_64.dmg
