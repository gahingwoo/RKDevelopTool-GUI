name: CI

# Cheap checks for every pull request and push to main. The full Nuitka /
# AppImage / DMG builds only run in release.yml on a tag, so this is what
# catches a broken start-up or broken packaging metadata before it merges.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Python this tests, on the same image the release builds use.
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-15
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Even the offscreen platform plugin links against EGL/GL and xkbcommon.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1

      # A real (non-editable) install, so missing package data shows up.
      - name: Install the package
        run: pip install .

      - name: Byte-compile every module
        run: python -m compileall -q rkdeveloptool-gui rkdevtoolgui.py build_nuitka.py

      - name: Start the app headless
        run: python tests/smoke.py

      # Synthetic update.img files, including sparse >4 GiB ones.
      - name: RKFW parser layouts
        run: python tests/rkfw_layouts.py

      - name: Check the Loader builder
        run: python tests/loader_merge.py

  dmg-layout:
    name: DMG layout (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          brew install create-dmg
          pip install PySide6

      # A placeholder .app is enough: this checks the window layout, the
      # Applications link and the note, not the app.
      - name: Build a DMG the way the release does
        run: |
          mkdir -p dist/RKDevelopTool-GUI.app/Contents/MacOS
          printf '#!/bin/sh\n' > dist/RKDevelopTool-GUI.app/Contents/MacOS/rkdevtoolgui
          chmod +x dist/RKDevelopTool-GUI.app/Contents/MacOS/rkdevtoolgui
          bash packaging/make-dmg.sh dist/RKDevelopTool-GUI.app dist/test.dmg 2>&1 | tee make-dmg.log
          if grep -q "building a plain DMG" make-dmg.log; then
            echo "::error::create-dmg failed; the release would ship a DMG without the window layout"
            exit 1
          fi

      - name: Check what is in it
        run: |
          M="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$M" dist/test.dmg
          ls -la "$M" "$M/.background" || true
          test "$(readlink "$M/Applications")" = /Applications
          test -f "$M/如果打不开 - If it won't open.txt"
          test -f "$M/.DS_Store"
          ls "$M/.background" | grep -q background
          hdiutil detach "$M"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-layout
          path: dist/test.dmg

  metadata:
    name: Desktop / AppStream metadata
    # Same validator version as the release build, which is what rejected the
    # vcs-browser URL.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils rpm

      # Build the deb and rpm from placeholder binaries to check the package
      # layout (the real binaries are only built on release tags).
      - name: Package layout (deb / rpm)
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz"
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          mkdir -p dist
          printf '#!/bin/sh\n' > dist/rkdevtoolgui
          printf '#!/bin/sh\n' > dist/rkdeveloptool
          export VERSION=0.0.0 PKG_ARCH=amd64
          nfpm package -f packaging/nfpm.yaml -p deb -t /tmp/
          nfpm package -f packaging/nfpm.yaml -p rpm -t /tmp/
          dpkg-deb -c /tmp/*.deb | grep -q ' ./usr/lib/udev/rules.d/70-rkdeveloptool-gui.rules$'
          dpkg-deb -I /tmp/*.deb postinst | grep -q udevadm
          rpm -qlp /tmp/*.rpm | grep -qx /usr/lib/udev/rules.d/70-rkdeveloptool-gui.rules
          rpm -qp --scripts /tmp/*.rpm | grep -q udevadm
          echo "udev rule and reload scripts are in both packages"

      # A release reads its notes from CHANGELOG.md; make sure the current
      # version has a section before anyone tags it.
      - name: Release notes for this version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' rkdeveloptool-gui/__init__.py)
          sh packaging/release-notes.sh "$VERSION" > /dev/null
          echo "CHANGELOG.md has notes for $VERSION"

      - name: Validate
        run: |
          appstreamcli validate --no-net packaging/io.github.gahingwoo.rkdeveloptool_gui.appdata.xml
          desktop-file-validate packaging/io.github.gahingwoo.rkdeveloptool_gui.desktop
